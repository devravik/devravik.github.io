  - name: TalkBridge
    category: Open Source
    role: Independent Software Developer
    period: '2025'
    layout: half
    description: >-
      Real-time video calls with live AI-translated captions - no app, no account, just a link. Deepgram Nova-2
      transcribes speech and Azure Cognitive Services translates, with captions pushed back over WebSocket in under
      500ms end-to-end. Supports 10 languages with an LLM fallback translation path.
    image: ./assets/projects/talkbridge-example.webp
    techStack:
      - Go (Fiber) + Gorilla WebSocket
      - Next.js 14, TypeScript, Tailwind CSS
      - WebRTC P2P (STUN/TURN)
      - Deepgram Nova-2 streaming STT
      - Azure Cognitive Services Translator
      - PostgreSQL + Docker
    links:
      - label: GitHub
        href: https://github.com/devravik/TalkBridge
