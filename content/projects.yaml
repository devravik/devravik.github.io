  - name: KundaliLabs
    category: Product
    role: Independent Software Developer
    period: 2025 - Present
    layout: hero
    description: >-
      AI-powered Vedic astrology platform using Swiss Ephemeris for all calculations and GPT-4o for interpretations.
      Covers Janam Kundli, daily horoscope, Panchang, Dasha timeline, Kundli matching, and numerology across 10 Indian
      languages. Available as a live web app and a mobile app on the Play Store.
    image: ./assets/projects/kundalilabs-example.webp
    techStack:
      - FastAPI (Python) backend
      - React + Vite frontend
      - PostgreSQL
      - Swiss Ephemeris for Jyotish calculations
      - OpenAI GPT-4o for AI interpretations
      - React Native mobile app
    links:
