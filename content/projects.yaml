  - name: RedditRadar
    category: Open Source
    role: Independent Software Developer
    period: '2025'
    layout: half
    description: >-
      Self-hosted Reddit lead discovery and AI analysis. Monitors subreddits for hiring posts and founder pain points,
      scores them against a custom engineer profile, pre-filters noise before LLM inference, and tracks outreach through
      a NEW → CONTACTED → REPLIED → ARCHIVED pipeline.
    image: ./assets/projects/redditradar-example.webp
    techStack:
      - Next.js 16 (App Router)
      - Prisma 7 + PostgreSQL
      - Tailwind CSS + shadcn/ui
      - AI scoring via OpenAI / OpenRouter / Groq
      - Reddit JSON API with rate-limit-aware pacing
      - Docker + self-hosted deployment
    links:
      - label: GitHub
        href: https://github.com/devravik/RedditRadar
  - name: Go License API
    category: Open Source
    role: Independent Software Developer
    period: '2025'
    layout: half
    description: >-
      High-performance, self-hosted license validation service built in Go. Designed for SaaS products, desktop apps,
      plugins, and indie tools - handles multi-tenant isolation, seat-based licensing, offline Ed25519 verification,
      webhooks, audit logging, and key rotation. Validation runs entirely from an in-memory L1 cache with no DB in the
      hot path.
    image: ./assets/projects/go-license-api-example.webp
    techStack:
      - Go 1.21+
      - PostgreSQL 14+ (control plane only)
      - Redis (optional L2 cache)
      - Ed25519 offline license signing
      - Worker pool + bounded queue
      - Docker + Kubernetes
    links:
      - label: GitHub
        href: https://github.com/devravik/go-license-api
